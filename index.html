<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<div id="root"></div>
<style>
  :root{
    --ink:#1c1712; --parch:#f4ecd8; --parch2:#ece1c4; --edge:#c9b68a;
    --gold:#a67c1a; --blood:#7c2b1e; --arc:#3a2d6b; --moss:#3d5a34;
    /* starred/favorite palette — cool blue to contrast the warm parchment */
    --star:#1d6fa5; --star-dk:#0f4a71; --star-lt:#d8ecfa; --star-lt2:#eaf5fd; --star-glow:rgba(45,140,200,.55);
    --shadow:rgba(40,28,10,.18);
  }
  *{box-sizing:border-box}
  #root{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    color:var(--ink); background:transparent; line-height:1.55;
    max-width:980px; margin:0 auto; padding:4px;
  }
  .head{text-align:center; padding:18px 12px 10px; border-bottom:3px double var(--edge); margin-bottom:14px}
  .head h1{font-size:clamp(24px,5vw,38px); margin:0; letter-spacing:.02em; font-weight:700; color:var(--blood); text-shadow:1px 1px 0 var(--edge)}
  .titlerow{display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:nowrap}
  .titleimg{
    width:58px; height:58px; border-radius:50%; object-fit:cover;
    border:2.5px solid var(--gold); box-shadow:0 2px 8px var(--shadow); flex:0 0 auto;
    background:var(--parch);
  }
  .head p{margin:6px 0 0; font-size:14px; font-style:italic; color:#4a3a24}

  .subtabs{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:12px}
  /* On desktop the wrapper is inert — display:contents removes it from layout
     so the existing centered, wrapping tab row is completely unchanged. */
  .subtabs-wrap{display:contents}
  .subtab{font-family:inherit; cursor:pointer; border:2px solid var(--edge); background:var(--parch); color:var(--ink); padding:8px 12px; border-radius:8px 8px 2px 2px; font-size:14px; font-weight:600; transition:.15s; box-shadow:0 2px 0 var(--shadow)}
  .subtab:hover{transform:translateY(-1px)}
  .subtab.on{background:var(--ink); color:var(--parch); border-color:var(--ink)}

  .levels{display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-bottom:10px}
  .lvbtn{font-family:inherit; cursor:pointer; width:42px; height:42px; border:2px solid var(--gold); background:var(--parch2); color:var(--ink); border-radius:50%; font-size:16px; font-weight:700; transition:.15s}
  .lvbtn:hover{background:var(--gold); color:#fff}
  .lvbtn.on{background:var(--blood); color:#fff; border-color:var(--blood); transform:scale(1.08)}
  .lvlbl{width:100%; text-align:center; font-size:12px; text-transform:uppercase; letter-spacing:.15em; color:#6b5a3f; margin-bottom:4px; font-weight:700}

  .viewtoggle{display:flex; gap:6px; justify-content:center; margin-bottom:16px; flex-wrap:wrap}
  .vt{font-family:inherit; cursor:pointer; border:1px solid var(--edge); background:var(--parch); color:var(--ink); padding:6px 16px; border-radius:20px; font-size:13px; font-weight:600}
  .vt.on{background:var(--moss); color:#fff; border-color:var(--moss)}

  .panel{background:linear-gradient(180deg,var(--parch),var(--parch2)); border:1px solid var(--edge); border-radius:10px; padding:18px 20px; box-shadow:0 4px 14px var(--shadow); animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .lvhead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--edge); padding-bottom:8px; margin-bottom:14px}
  .lvhead h2{margin:0; font-size:22px; color:var(--blood)}
  .lvhead .sub{font-size:14px; color:#4a3a24; font-weight:600}

  .sec{margin-bottom:18px}
  .sec h3{font-size:13px; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); margin:0 0 8px; border-left:3px solid var(--gold); padding-left:8px}

  .actcard{margin:0 0 12px; padding:12px 14px; background:rgba(255,255,255,.45); border-radius:7px; border:1px solid var(--edge)}
  .actcard .ttl{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:5px}
  .actcard .ttl b{font-size:15px; color:var(--arc)}
  .actcard .meta{font-size:12px; color:#5c4a2f; margin-bottom:6px; font-weight:600}
  .actcard .body p{margin:4px 0}
  .actcard .body ul{margin:4px 0 4px 18px}
  .actcard .body li{margin:2px 0}
  .tag{display:inline-block; font-size:11px; background:var(--ink); color:var(--parch); padding:1px 8px; border-radius:20px; font-style:normal}
  .ki{display:inline-block; background:var(--arc); color:#fff; padding:1px 8px; border-radius:5px; font-size:11px; font-weight:700}
  .warn{background:var(--blood); color:#fff; padding:1px 7px; border-radius:5px; font-size:11px; font-weight:600}
  /* Casting-time icons: green circle = Action, orange triangle = Bonus Action */
  .caticon{display:inline-block; vertical-align:middle; margin-right:4px; line-height:1}
  .caticon.act{width:11px; height:11px; border-radius:50%; background:#2e8b3d; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), 0 0 3px rgba(46,139,61,.5)}
  .caticon.bonus{width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:11px solid #e08a1e; filter:drop-shadow(0 0 2px rgba(224,138,30,.5)); border-radius:1px}
  /* Ki points resource panel — bright, tactile, resource-tracker feel */
  .kicard{
    margin:0 0 12px; padding:14px 16px; border-radius:12px;
    background:linear-gradient(150deg,#4a3aa0 0%,#3a2d6b 55%,#2a2050 100%);
    border:2px solid #7a68d8; box-shadow:0 4px 14px rgba(40,28,90,.35), inset 0 1px 0 rgba(255,255,255,.18);
    color:#f3f0ff;
  }
  .kicard-top{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 12px; margin-bottom:10px}
  .kicard-name{font-size:17px; font-weight:800; letter-spacing:.02em; color:#fff; display:flex; align-items:center; gap:8px}
  .kicard-name .spark{font-size:18px; filter:drop-shadow(0 0 5px rgba(180,160,255,.9))}
  .kicard-pool{font-size:12.5px; font-weight:700; color:#d7ccff}
  .kicard-pool b{color:#fff; font-size:14px}
  .kipips{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 12px}
  .kipip{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#c9b6ff,#8a72e6 60%,#6a52c8);
    border:1.5px solid #d9ccff; box-shadow:0 0 8px rgba(170,140,255,.7), inset 0 1px 2px rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#2a2050;
  }
  .kipip.empty{background:rgba(255,255,255,.06); border:1.5px dashed rgba(215,204,255,.4); box-shadow:none; color:transparent}
  .kicard-stats{display:flex; flex-wrap:wrap; gap:8px}
  .kistat{flex:1 1 140px; background:rgba(255,255,255,.1); border:1px solid rgba(215,204,255,.32); border-radius:8px; padding:8px 10px}
  .kistat .kl{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:#c3b6f5; font-weight:700}
  .kistat .kv{font-size:16px; font-weight:800; color:#fff; margin-top:2px}
  .kistat .kv .rmlbl{color:#d7ccff; font-weight:700}
  .kistat .ks{font-size:11px; color:#cec3f5; margin-top:1px}
  .kicard-foot{font-size:12px; color:#d7ccff; margin-top:10px; line-height:1.5}

  .roll{font-family:"Courier New",monospace; background:var(--ink); color:#ffe9a8; padding:1px 6px; border-radius:4px; font-size:12.5px; white-space:nowrap}

  table{width:100%; border-collapse:collapse; margin:6px 0; font-size:12.8px}
  th,td{border:1px solid var(--edge); padding:5px 8px; text-align:left; vertical-align:top}
  th{background:var(--ink); color:var(--parch); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em}
  tr:nth-child(even) td{background:rgba(255,255,255,.35)}
  td.nm{white-space:nowrap; font-weight:600}
  .conc{color:var(--blood); font-weight:700; font-size:11px} .rit{color:var(--moss); font-weight:700; font-size:11px}

  .note{font-size:13.5px; color:#3a2f1e; margin-top:6px; line-height:1.5; font-weight:500}

  .dcbar{display:flex; gap:10px; flex-wrap:wrap; margin:0 0 16px; padding:12px 14px; background:var(--ink); border-radius:8px; border:2px solid var(--gold)}
  .dcitem{flex:1; min-width:150px; text-align:center; padding:4px 8px}
  .dcitem .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:#ffe9a8; opacity:.85; margin-bottom:3px}
  .dcitem .val{font-size:20px; font-weight:800; color:#fff; font-family:"Courier New",monospace}
  .dcitem .sub{font-size:11px; color:#ffe9a8; margin-top:2px; font-weight:600}
  .dcdivider{width:1px; background:rgba(255,233,168,.3); align-self:stretch}
  /* Personalized "your DC" items — brighter, gold-tinted, to stand out from the generic formula */
  .dcitem.yours{background:linear-gradient(180deg,rgba(166,124,26,.32),rgba(166,124,26,.15)); border-radius:8px; box-shadow:inset 0 0 0 1.5px var(--gold)}
  .dcitem.yours .lbl{color:#ffe9a8; opacity:1; font-weight:800}
  .dcitem.yours .val{font-size:30px; color:#fff; text-shadow:0 1px 6px rgba(166,124,26,.7)}
  .dcitem.yours .sub{color:#ffedb8; opacity:.95}
  .dcdivider.mine{background:var(--gold); width:2px}
  .dcitem.yourshint{flex:1 1 100%; text-align:center; opacity:.85; border-top:1px dashed rgba(255,233,168,.35); margin-top:6px; padding-top:8px}
  .dcitem.yourshint .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:#ffe9a8; margin-bottom:3px}
  .dcitem.yourshint .sub{font-size:11.5px; color:#ffe9a8; font-weight:600}
  .dcitem.yourshint b{color:#fff}

  /* ---- Class resource boxes: sit beside the DC bar, styled to match it ---- */
  .dcrow{display:flex; gap:10px; align-items:stretch; margin:0 0 16px; flex-wrap:wrap}
  .dcrow > .dcbar{flex:2 1 320px; margin:0}
  .resbar{flex:1 1 220px; display:flex; flex-wrap:wrap; gap:10px; margin:0; padding:12px 14px;
    background:var(--ink); border-radius:8px; border:2px solid var(--edge)}
  .resitem{flex:1 1 96px; min-width:88px; text-align:center; padding:4px 8px}
  .resitem .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:#e7d9b0; opacity:.85; margin-bottom:3px}
  .resitem .val{font-size:20px; font-weight:800; color:#fff; font-family:"Courier New",monospace; line-height:1.1}
  .resitem .sub{font-size:10.5px; color:#e7d9b0; margin-top:2px; font-weight:600; line-height:1.35}
  .slotnums{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .slotnum{display:flex; flex-direction:column; align-items:center; line-height:1}
  .slotnum b{font-size:20px; font-weight:800; color:#fff; font-family:"Courier New",monospace}
  .slotnum .sll{font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:#e7d9b0; opacity:.85; margin-top:2px; font-weight:700}

  /* ---- Inline modifier inputs (sync with My Character) ---- */
  .modbar{
    display:flex; align-items:center; flex-wrap:wrap; gap:10px;
    background:rgba(166,124,26,.1); border:1.5px solid var(--gold); border-radius:9px;
    padding:9px 13px; margin:0 0 14px;
  }
  .modbar-title{font-weight:800; font-size:12.5px; color:var(--blood); text-transform:uppercase; letter-spacing:.06em}
  .modbar-note{font-size:11.5px; color:#7a6b4e; flex:1 1 100%; margin-top:-2px}
  .modinput{display:inline-flex; align-items:center; gap:5px}
  .modinput-lbl{font-weight:800; font-size:12px; color:var(--blood); letter-spacing:.03em}
  .modinput input{
    width:52px; border:1.5px solid var(--edge); border-radius:7px; padding:6px 6px;
    background:#fff; color:var(--ink); font-size:15px; font-weight:700; text-align:center; font-family:inherit;
  }
  .modinput input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 2px rgba(166,124,26,.2)}
  /* the little "(WIS)" tag inside a resolved dice roll */
  .rmlbl{font-size:.82em; opacity:.8; font-weight:600}
  .wdmod{display:inline-block; margin-left:4px; padding:1px 6px; border-radius:6px; background:rgba(120,85,20,.1); color:#5a4413; font-weight:700; white-space:nowrap}
  .slots{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
  .slot{background:var(--arc); color:#fff; padding:3px 9px; border-radius:5px; font-size:12px; font-weight:600}
  .pill{display:inline-block; background:var(--moss); color:#fff; padding:1px 7px; border-radius:5px; font-size:11px; margin:1px 2px; font-weight:600}
  .pill.dom{background:var(--gold)}
  .legend{font-size:12.5px; color:#3a2f1e; margin:8px 0; display:flex; gap:14px; flex-wrap:wrap; font-weight:500}
  .foot{text-align:center; font-size:12px; color:#5c4a2f; margin-top:18px; font-style:italic}

  /* ---- Search / filter ---- */
  .searchwrap{
    position:sticky; top:0; z-index:15;
    background:linear-gradient(180deg,var(--parch) 78%,rgba(244,236,216,0));
    padding:10px 0 12px; margin:-4px 0 10px;
  }
  .searchrow{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:2px solid var(--edge); border-radius:10px;
    padding:0 12px; box-shadow:0 2px 6px var(--shadow);
    transition:border-color .15s;
  }
  .searchrow:focus-within{border-color:var(--gold)}
  .searchicon{font-size:19px; color:var(--gold); font-weight:700; line-height:1}
  .searchinput{
    flex:1; border:0; outline:0; background:transparent;
    font-family:inherit; font-size:15px; color:var(--ink);
    padding:11px 0; min-width:0;
  }
  .searchinput::placeholder{color:#9c8a68}
  .searchinput::-webkit-search-cancel-button{display:none}
  .searchclear{
    border:0; background:var(--edge); color:var(--ink); cursor:pointer;
    width:26px; height:26px; border-radius:50%; font-size:13px; font-weight:700;
    font-family:inherit; line-height:1; flex:0 0 auto;
  }
  .searchclear:hover{background:var(--blood); color:#fff}
  .searchcount{font-size:12px; color:#5c4a2f; font-weight:600; margin:6px 2px 0}
  .emptymsg{
    padding:16px; text-align:center; color:#5c4a2f;
    background:rgba(255,255,255,.45); border:1px dashed var(--edge); border-radius:8px;
    font-size:13.5px;
  }
  .chiprow{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px}
  .chip{
    font-family:inherit; cursor:pointer; border:1.5px solid var(--edge);
    background:var(--parch); color:var(--ink); padding:6px 13px;
    border-radius:20px; font-size:13px; font-weight:600; transition:.15s;
  }
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--arc); color:#fff; border-color:var(--arc)}

  /* ---- Starred spells ---- */
  .starbtn{
    background:none; border:0; cursor:pointer; font-family:inherit;
    font-size:19px; line-height:1; padding:2px 4px; display:inline-block;
    color:#b0a081; transition:transform .12s, color .12s;
  }
  .starbtn:hover{transform:scale(1.25); color:var(--star)}
  .starbtn.on{color:#1d8fd1; font-size:22px; text-shadow:0 0 7px var(--star-glow), 0 1px 2px rgba(0,0,0,.28)}
  .starcell{text-align:center; vertical-align:middle}
  .mobstar{display:none}   /* desktop uses the dedicated star column instead */
  /* Starred rows get a gold spine + warm tint so they pop while scrolling */
  /* Starred rows: heavy gold treatment so they're impossible to miss */
  tr.starred td{
    background:linear-gradient(90deg,var(--star-lt),var(--star-lt2) 40%) !important;
    border-top:2px solid var(--star); border-bottom:2px solid var(--star);
  }
  tr.starred td:first-child{
    box-shadow:inset 5px 0 0 var(--star);
    border-left:2px solid var(--star);
  }
  tr.starred td:last-child{border-right:2px solid var(--star)}
  tr.starred td.nm{
    color:var(--star-dk); font-weight:800;
    text-shadow:0 1px 0 rgba(255,255,255,.75);
  }
  tr.starred td.nm::after{
    content:"★ STARRED"; display:inline-block; margin-left:8px;
    background:var(--star); color:#fff; font-size:9px; font-weight:800;
    letter-spacing:.1em; padding:2px 7px; border-radius:20px;
    vertical-align:middle; white-space:nowrap;
  }
  .favtab{
    background:linear-gradient(180deg,#e8f4fc,#cfe6f7); color:var(--star-dk);
    border-color:var(--star) !important; font-weight:700;
  }
  .favtab.on{background:linear-gradient(180deg,#2585c0,#1d6fa5) !important; color:#fff !important; border-color:var(--star-dk) !important}
  .favcount{
    display:inline-block; margin-left:6px; background:var(--blood); color:#fff;
    border-radius:20px; padding:1px 7px; font-size:11px; font-weight:800; vertical-align:middle;
  }
  .favtab.on .favcount{background:#fff; color:var(--star-dk)}

  /* ---- Character profile ---- */
  .profile{max-width:760px}
  .psub{
    font-weight:800; color:var(--blood); margin:20px 0 9px; font-size:15px;
    border-bottom:1px solid var(--edge); padding-bottom:5px;
  }
  .psub small{font-weight:600; color:#7a6b4e; font-size:12.5px}
  .pfields{display:flex; flex-wrap:wrap; gap:12px}
  .pf{display:flex; flex-direction:column; gap:4px; flex:1 1 200px}
  .pf.pf-sm{flex:0 0 130px}
  .pf span{font-weight:700; font-size:13px; color:var(--ink)}
  .pf span em{font-weight:600; color:#8a7a5c; font-style:italic}
  .pf small{color:#8a7a5c; font-size:11px}
  .pf input, .pmod input{
    border:1.5px solid var(--edge); border-radius:8px; padding:9px 10px;
    background:#fff; color:var(--ink); font-size:15px; font-family:inherit; width:100%;
  }
  .pf input:focus, .pmod input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 2px rgba(166,124,26,.2)}
  .pmods{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
  .pmod{display:flex; flex-direction:column; gap:4px; align-items:center}
  .pmod span{font-weight:800; font-size:12px; color:var(--blood); letter-spacing:.04em}
  .pmod input{text-align:center; padding:9px 4px; font-weight:700}
  .pcast{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .pcastbtn{
    border:1.5px solid var(--gold); background:var(--parch); color:var(--ink);
    border-radius:8px; padding:8px 14px; font-weight:700; font-size:14px; cursor:pointer;
    font-family:inherit; transition:all .12s;
  }
  .pcastbtn.on{background:var(--gold); color:#fff}
  .pcasthint{font-size:12px; color:#8a7a5c; flex:1 1 100%}
  .pcalc{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px}
  .pcalcitem{
    border:1.5px solid var(--edge); border-radius:10px; padding:12px 10px; text-align:center;
    background:rgba(255,255,255,.5);
  }
  .pcalcitem.hero{border-color:var(--gold); background:rgba(166,124,26,.08)}
  .pcv{font-size:30px; font-weight:800; color:var(--blood); line-height:1}
  .pcalcitem.hero .pcv{color:var(--gold)}
  .pcl{font-weight:700; font-size:12.5px; margin-top:4px; color:var(--ink)}
  .pce{font-size:11px; color:#8a7a5c; margin-top:3px}
  .pcheck{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink); cursor:pointer; margin-bottom:4px}
  .pcheck input{width:17px; height:17px; accent-color:var(--gold)}
  .psaves{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
  .psave{
    border:1.5px solid var(--edge); border-radius:9px; padding:9px 6px; text-align:center;
    background:rgba(255,255,255,.5);
  }
  .psave.on{border-color:var(--gold); background:rgba(166,124,26,.1)}
  .psavehead{display:flex; align-items:center; justify-content:center; gap:5px; font-weight:800; font-size:12px; color:var(--blood); cursor:pointer}
  .psavehead input{width:15px; height:15px; accent-color:var(--gold)}
  .psaveval{font-size:22px; font-weight:800; color:var(--ink); margin-top:5px}
  .preset{
    margin-top:22px; border:1.5px solid var(--blood); background:transparent; color:var(--blood);
    border-radius:8px; padding:9px 18px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;
  }
  .preset:hover{background:var(--blood); color:#fff}

  /* ---- Help: floating button + modal ---- */
  .helpfab{
    position:fixed; bottom:20px; right:20px; z-index:50;
    width:52px; height:52px; border-radius:50%; border:2px solid #fff;
    background:var(--blood); color:#fff; font-size:26px; font-weight:800; font-family:inherit;
    cursor:pointer; box-shadow:0 3px 12px rgba(40,28,10,.45); line-height:1;
    display:flex; align-items:center; justify-content:center; transition:transform .12s, background .12s;
  }
  .helpfab:hover{background:var(--gold); transform:scale(1.06)}
  .helpoverlay{
    position:fixed; inset:0; z-index:60; background:rgba(28,23,18,.66);
    display:flex; align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto;
    animation:helpfade .16s ease;
  }
  @keyframes helpfade{from{opacity:0}to{opacity:1}}
  .helpmodal{
    position:relative; background:var(--parch); color:var(--ink);

/* ---- Search helpers ----
   Spell/weapon descriptions are JSX, not strings, so pull the plain text out
   recursively in order to match against a query. */
function nodeText(node){
  if(node==null || node===false || node===true) return "";
  if(typeof node==="string" || typeof node==="number") return String(node);
  if(Array.isArray(node)) return node.map(nodeText).join(" ");
  if(node.props) return nodeText(node.props.children);
  return "";
}
function rowText(row){ return row.map(nodeText).join(" ").toLowerCase(); }

   searching "heal" finds "regains hit points", "aoe" finds radius/cone, etc. */
const SEARCH_ALIASES = {
  heal:["regain","restore","hit points","cure","healing"],
  healing:["regain","restore","hit points","cure"],
  aoe:["radius","cone","cube","sphere","line","each creature"],
  area:["radius","cone","cube","sphere","line"],
  damage:["d4","d6","d8","d10","d12","damage"],
  buff:["advantage","bonus","temp hp","resistance","+1","+2"],
  debuff:["disadvantage","save or","reduced","halved","cursed"],
  control:["restrained","paralyzed","prone","incapacitated","stunned","charmed","difficult terrain"],
  cc:["restrained","paralyzed","prone","incapacitated","charmed","frightened"],
  concentration:["conc"],
  ranged:["ft,","range"],
  revive:["dead","died","raise","revivify","life"],
  teleport:["teleport","misty step","dimension door"],
  summon:["conjure","summon","animate","familiar"],
};
function filterRows(rows, q){
  const s = q.trim().toLowerCase();
  if(!s) return rows;
  const terms = s.split(/\s+/);
  return rows.filter(r=>{
    const t = rowText(r);
    return terms.every(term=>{
      if(t.includes(term)) return true;
      const alts = SEARCH_ALIASES[term];
      return alts ? alts.some(a=>t.includes(a)) : false;
    });
  });
}
function SearchBox({value, onChange, placeholder, count, total}){

  );
}

/* ============================================================
   STARRED SPELLS — persistent favorites across tabs & sessions
   Tries localStorage so stars survive closing the file; falls back
   to in-memory if storage is unavailable (e.g. sandboxed viewer).
============================================================ */
const STAR_KEY = "dnd_codex_starred_v1";
function loadStars(){
  try{
    const raw = window.localStorage.getItem(STAR_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}
function saveStars(set){
  try{ window.localStorage.setItem(STAR_KEY, JSON.stringify(Array.from(set))); }
  catch(e){ /* storage blocked — stars still work for this session */ }
}
const StarCtx = React.createContext(null);
function StarProvider({children}){
  const [stars, setStars] = useState(()=>loadStars());
  const toggle = (id)=>{
    setStars(prev=>{
      const next = new Set(prev);
      if(next.has(id)) next.delete(id); else next.add(id);
      saveStars(next);
      return next;
    });
  };
  const clearAll = ()=>{ const empty=new Set(); saveStars(empty); setStars(empty); };
  return <StarCtx.Provider value={{stars, toggle, clearAll}}>{children}</StarCtx.Provider>;
}
function useStars(){ return React.useContext(StarCtx) || {stars:new Set(), toggle:()=>{}, clearAll:()=>{}}; }
// Stable ID for a spell: its name is unique enough across the whole book,
// and using the name alone means starring Fireball on the Wizard tab also
// shows it starred in Master Reference.
const spellId = (row)=> "s:"+nodeText(row[0]).trim().toLowerCase();

/* ============================================================
   CHARACTER PROFILE — one saved character per device.
   Player enters ability modifiers + level; the sheet computes
   spell save DC, spell attack, saving throws, passive Perception,
   and initiative so they never recalculate mid-combat.
   Same localStorage-with-fallback approach as starred spells.
============================================================ */
const PROFILE_KEY = "dnd_codex_profile_v1";
const BLANK_PROFILE = {
  name:"", cls:"", level:1, profOverride:"",
  castStat:"cha",
  mods:{str:0, dex:0, con:0, int:0, wis:0, cha:0},
  saveProf:{str:false, dex:false, con:false, int:false, wis:false, cha:false},
  perceptionProf:false,
};
function loadProfile(){
  try{
    const raw = window.localStorage.getItem(PROFILE_KEY);
    if(!raw) return {...BLANK_PROFILE};
    const p = JSON.parse(raw);
    // Merge over blank so older/partial saves don't crash on missing keys.
    return {
      ...BLANK_PROFILE, ...p,
      mods:{...BLANK_PROFILE.mods, ...(p.mods||{})},
      saveProf:{...BLANK_PROFILE.saveProf, ...(p.saveProf||{})},
    };
  }catch(e){ return {...BLANK_PROFILE}; }
}
function saveProfile(p){
  try{ window.localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }
  catch(e){ /* storage blocked — profile still works this session */ }
}
const ProfileCtx = React.createContext(null);
function ProfileProvider({children}){
  const [profile, setProfile] = useState(()=>loadProfile());
  const update = (patch)=>{
    setProfile(prev=>{ const next={...prev, ...patch}; saveProfile(next); return next; });
  };
  const updateNested = (key, subkey, value)=>{
    setProfile(prev=>{
      const next={...prev, [key]:{...prev[key], [subkey]:value}};
      saveProfile(next); return next;
    });
  };
  const reset = ()=>{ const b={...BLANK_PROFILE}; saveProfile(b); setProfile(b); };
  return <ProfileCtx.Provider value={{profile, update, updateNested, reset}}>{children}</ProfileCtx.Provider>;
}
function useProfile(){
  return React.useContext(ProfileCtx) || {profile:{...BLANK_PROFILE}, update:()=>{}, updateNested:()=>{}, reset:()=>{}};
}

/* ============================================================
   INLINE MODIFIER INPUTS — appear on class & master tabs, and
   read/write the SAME saved profile as My Character, so editing
   in either place keeps everything in sync.
============================================================ */
const clampModVal = (v)=>{ let n=parseInt(v,10); if(isNaN(n)) n=0; return Math.max(-5, Math.min(12, n)); };
// One compact ability-mod input bound to profile.mods[statKey].
// Keeps a local draft string so the field can be emptied or hold an
// in-progress "-" without snapping to 0, and only commits a clamped
// number to the shared profile on change/blur.
function ModInput({statKey}){
  const {profile, updateNested} = useProfile();
  const stored = (profile.mods && typeof profile.mods[statKey]==="number") ? profile.mods[statKey] : 0;
  const [draft, setDraft] = useState(String(stored));
  const [editing, setEditing] = useState(false);
  // When the profile changes elsewhere (e.g. My Character tab) and we're not
  // mid-edit here, mirror the new value into the field.
  React.useEffect(()=>{ if(!editing) setDraft(String(stored)); }, [stored, editing]);
  const commit = (raw)=>{
    // Empty or a lone sign means "no value yet" → treat as 0 in the profile,
    // but leave the field itself for the user to keep typing.
    if(raw==="" || raw==="-" || raw==="+"){ updateNested("mods", statKey, 0); return; }
    updateNested("mods", statKey, clampModVal(raw));
  };
  return (
    <span className="modinput">
      <span className="modinput-lbl">{statKey.toUpperCase()}</span>
      <input type="text" inputMode="numeric" pattern="-?[0-9]*"
        value={draft}
        aria-label={statKey.toUpperCase()+" modifier"}
        onFocus={()=>setEditing(true)}
        onChange={e=>{
          let v = e.target.value;
          // Allow only an optional leading minus and digits while typing.
          if(!/^-?\d*$/.test(v)) return; // ignore stray characters
          setDraft(v);
          commit(v);
        }}
        onBlur={e=>{
          setEditing(false);
          const n = clampModVal(e.target.value);
          setDraft(String(n));
          updateNested("mods", statKey, n);
        }} />
    </span>
  );
}
// A labeled strip of one or more modifier inputs to pin at the top of a tab.
function ModBar({statKeys, note}){
  return (
    <div className="modbar">
      <span className="modbar-title">Your modifiers</span>
      {statKeys.map(k=><ModInput key={k} statKey={k}/>)}
      <span className="modbar-note">{note || "Synced with 👤 My Character — edit here or there."}</span>
    </div>
  );
}
// Reads a single ability modifier from the profile (0 if unset).
function useMod(statKey){
  const {profile} = useProfile();
  return (profile.mods && typeof profile.mods[statKey]==="number") ? profile.mods[statKey] : 0;
}
// Renders a flat computed total: base + sum of stat mods, showing the breakdown.
//   base=10 statKeys=["dex","wis"]  →  "15 (10 + DEX +3 + WIS +2)"
function FlatCalc({base, statKeys}){
  const {profile} = useProfile();
  const mods = profile.mods || {};
  const set = profile && (profile.name || statKeys.some(k=>(mods[k]||0)!==0));
  const total = base + statKeys.reduce((n,k)=>n+(mods[k]||0), 0);
  const parts = statKeys.map(k=>`${k.toUpperCase()} ${fmt(mods[k]||0)}`).join(" + ");
  return (
    <Roll>{total} <span className="rmlbl">({base} + {parts}{set?"":", mods unset"})</span></Roll>
  );
}
// Renders just the resolved modifier value on its own (e.g. temp HP = CHA mod).
function BareMod({statKey}){
  const mod = useMod(statKey);
  const {profile} = useProfile();
  const set = profile && (mod!==0 || profile.name);
  return <Roll>{fmt(mod)} <span className="rmlbl">({statKey.toUpperCase()}{set?"":" mod"})</span></Roll>;
}
// Renders a dice formula with the player's actual modifier filled in:
//   base="1d8" statKey="wis"  →  "1d8 +4 (WIS)"   (or "1d8 + WIS mod" if unset & showPrompt)
function RolledMod({base, statKey}){
  const mod = useMod(statKey);
  const {profile} = useProfile();
  const set = profile && (mod!==0 || profile.name);
  return (
    <Roll>{base} {fmt(mod)} <span className="rmlbl">({statKey.toUpperCase()}{set?"":" mod"})</span></Roll>
  );
}

// Proficiency from level (2014 table): +2 (1–4), +3 (5–8), +4 (9–12)...
function profFromLevel(lv){ return 2 + Math.floor((Math.max(1,Math.min(20,lv)) - 1) / 4); }
// Effective prof honors a manual override if the player typed one.
function effProf(p){
  const o = parseInt(p.profOverride,10);
  return (!isNaN(o) && p.profOverride!=="") ? o : profFromLevel(p.level||1);
}
const fmt = (n)=> (n>=0?"+":"")+n;  // signed display, e.g. +3 / -1
const CAST_LABEL = {int:"Intelligence", wis:"Wisdom", cha:"Charisma"};
const ABILITIES = [["str","STR"],["dex","DEX"],["con","CON"],["int","INT"],["wis","WIS"],["cha","CHA"]];

// Ability-mod input for the My Character tab. Same local-draft behavior as
// ModInput (can be emptied / hold a lone "-"), but keeps the .pmod label layout.
function PMod({statKey, label}){
  const {profile, updateNested} = useProfile();
  const stored = (profile.mods && typeof profile.mods[statKey]==="number") ? profile.mods[statKey] : 0;
  const [draft, setDraft] = useState(String(stored));
  const [editing, setEditing] = useState(false);
  React.useEffect(()=>{ if(!editing) setDraft(String(stored)); }, [stored, editing]);
  return (
    <label className="pmod"><span>{label}</span>
      <input type="text" inputMode="numeric" pattern="-?[0-9]*" value={draft}
        aria-label={label+" modifier"}
        onFocus={()=>setEditing(true)}
        onChange={e=>{
          let v = e.target.value;
          if(!/^-?\d*$/.test(v)) return;
          setDraft(v);
          if(v==="" || v==="-" || v==="+"){ updateNested("mods", statKey, 0); }
          else updateNested("mods", statKey, clampModVal(v));
        }}
        onBlur={e=>{
          setEditing(false);
          const n = clampModVal(e.target.value);
          setDraft(String(n));
          updateNested("mods", statKey, n);
        }} />
    </label>
  );
}

  return (
    <div className="profile">
      <div className="note" style={{marginBottom:14}}>
        Enter your ability modifiers (the small ± number, not the score) and level once.

      {/* Identity */}
      <div className="pfields">

            onChange={e=>update({cls:e.target.value})} /></label>

            onChange={e=>update({level:Math.max(1,Math.min(20,parseInt(e.target.value,10)||1))})} /></label>
        <label className="pf pf-sm"><span>Prof. bonus <em>(auto)</em></span>
          <input type="number" value={p.profOverride} placeholder={"+"+profFromLevel(p.level||1)}
            onChange={e=>update({profOverride:e.target.value})} />
          <small>Blank = auto from level (+{profFromLevel(p.level||1)})</small></label>
      </div>

      {/* Ability modifiers */}
      <div className="psub">Ability modifiers</div>
      <div className="pmods">
        {ABILITIES.map(([k,lbl])=>(
          <PMod key={k} statKey={k} label={lbl} />
        ))}
      </div>

      {/* Spellcasting ability picker */}
      <div className="psub">Spellcasting ability</div>
      <div className="pcast">
        {["int","wis","cha"].map(k=>(
          <button key={k} className={"pcastbtn"+(p.castStat===k?" on":"")}
            onClick={()=>update({castStat:k})}>{CAST_LABEL[k]}</button>
        ))}
        <span className="pcasthint">Bard = CHA · Cleric/Druid/Monk = WIS · Wizard = INT</span>
      </div>

      {/* Computed headline values */}
      <div className="psub">Your numbers</div>
      <div className="pcalc">
        <div className="pcalcitem hero"><div className="pcv">{saveDC}</div><div className="pcl">Spell Save DC</div><div className="pce">8 + {prof} prof + {fmt(castMod)} {p.castStat.toUpperCase()}</div></div>
        <div className="pcalcitem hero"><div className="pcv">{fmt(spellAtk)}</div><div className="pcl">Spell Attack</div><div className="pce">{prof} prof + {fmt(castMod)} {p.castStat.toUpperCase()}</div></div>
        <div className="pcalcitem"><div className="pcv">{passivePerc}</div><div className="pcl">Passive Perception</div><div className="pce">10 + {fmt(p.mods.wis||0)} WIS{p.perceptionProf?" + "+prof+" prof":""}</div></div>
        <div className="pcalcitem"><div className="pcv">{fmt(initiative)}</div><div className="pcl">Initiative</div><div className="pce">{fmt(p.mods.dex||0)} DEX</div></div>
      </div>
      <label className="pcheck">
        <input type="checkbox" checked={p.perceptionProf}
          onChange={e=>update({perceptionProf:e.target.checked})} />
        Proficient in Perception (adds prof to passive)
      </label>

      {/* Saving throws */}
      <div className="psub">Saving throws <small>— tick the two your class is proficient in</small></div>
      <div className="psaves">
        {ABILITIES.map(([k,lbl])=>{
          const val = (p.mods[k]||0) + (p.saveProf[k] ? prof : 0);
          return (
            <div key={k} className={"psave"+(p.saveProf[k]?" on":"")}>
              <label className="psavehead">
                <input type="checkbox" checked={p.saveProf[k]}
                  onChange={e=>updateNested("saveProf", k, e.target.checked)} />
                {lbl}
              </label>
              <div className="psaveval">{fmt(val)}</div>
            </div>
          );
        })}
      </div>

      <button className="preset" onClick={()=>{ if(window.confirm("Clear this character profile? This can't be undone.")) reset(); }}>
        Reset profile
      </button>
    </div>
  );
}

// Casting-time icons. Reuses the module-level nodeText() to scan an arbitrary
// React node (string or JSX fragment) for casting-time words.
const ActIcon  = () => <span className="caticon act" title="Action" aria-label="Action"></span>;
const BonusIcon = () => <span className="caticon bonus" title="Bonus Action" aria-label="Bonus Action"></span>;
// Given a casting-time / type node, return leading icon(s) for it: an orange
// triangle for Bonus Action and/or a green circle for Action. Handles entries
// that mention both (e.g. "Action then Bonus Action").
function castIcons(node){
  const t = nodeText(node).toLowerCase();
  const hasBonus = t.includes("bonus action");
  // Strip phrases where "action" is prose, not a casting time, before testing:
  // "bonus action" (counted separately) and "attack action" (a reference, e.g.
  // a passive that keys off taking the Attack action).
  const stripped = t.replace(/bonus action/g, "").replace(/attack action/g, "");
  const hasAction = /\baction\b/.test(stripped);
  if(!hasAction && !hasBonus) return null;
  return (<>{hasAction && <ActIcon/>}{hasBonus && <BonusIcon/>}</>);
}
// Prefix a Type/meta node with its casting-time icon(s).
function withCastIcons(node){
  const ic = castIcons(node);
  return ic ? <>{ic}{node}</> : node;
}

const casterNote = (stat, prof) => (<div className="note">"Upcast" = cast using a higher slot for the listed extra scaling. Numbers above already include your prof bonus at this tier (+{prof}) — just add your {stat} modifier.</div>);
function DCBar({statLabel, prof}){
  const dc = 8 + prof;
  const atk = prof;
  // Pull the player's saved profile so we can show their ACTUAL numbers.
  // statLabel is the class's casting stat ("CHA"/"WIS"/"INT"); map it to the
  // matching ability modifier the player entered in My Character.
  const {profile} = useProfile();
  const modKey = statLabel.toLowerCase();
  const hasMod = profile && profile.mods && typeof profile.mods[modKey] === "number";
  const myMod = hasMod ? profile.mods[modKey] : 0;
  const entered = hasMod && (profile.mods[modKey] !== 0 || profile.name);
  // "entered" is a light heuristic: a nonzero mod, or any saved name, means the
  // player has actually set up their profile (a true 0 mod with a name still shows).
  const myDC = 8 + prof + myMod;
  const myAtk = prof + myMod;
  // Once the player has entered stats, show only the resolved numbers — the
  // generic formula boxes are dropped to avoid redundancy and save space.
  if(entered){
    return (
      <div className="dcbar">
        <div className="dcitem yours">
          <div className="lbl">Your Spell Save DC</div>
          <div className="val">{myDC}</div>
          <div className="sub">8 + prof({prof}) + {statLabel}({fmt(myMod)})</div>
        </div>
        <div className="dcdivider mine"></div>
        <div className="dcitem yours">
          <div className="lbl">Your Spell Attack</div>
          <div className="val">d20 {fmt(myAtk)}</div>
          <div className="sub">prof({prof}) + {statLabel}({fmt(myMod)})</div>
        </div>
      </div>
    );
  }
  return (
    <div className="dcbar">
      <div className="dcitem">
        <div className="lbl">Spell Save DC</div>
        <div className="val">{dc} + {statLabel} mod</div>
        <div className="sub">= 8 + prof({prof}) + {statLabel}</div>
      </div>
      <div className="dcdivider"></div>
      <div className="dcitem">
        <div className="lbl">Spell Attack Roll</div>
        <div className="val">d20 +{atk} + {statLabel} mod</div>
        <div className="sub">= d20 + prof({prof}) + {statLabel}</div>
      </div>
      <div className="dcitem yourshint">
        <div className="lbl">Your Spell Save DC</div>
        <div className="sub">Enter your {statLabel} modifier in <b>👤 My Character</b> and your exact DC shows here automatically.</div>
      </div>
    </div>
  );
}
function KiDCBar({lv}){
  const prof = lv>=5?3:2;
  const dc = 8+prof;
  const {profile} = useProfile();
  const wis = (profile && profile.mods && typeof profile.mods.wis==="number") ? profile.mods.wis : 0;

  const myDC = 8 + prof + wis;

  const myAtk = prof + best.v;

          <div className="val">d20 {fmt(myAtk)}</div>

      <div className="dcitem">

        <div className="sub">Enter your WIS modifier in <b>👤 My Character</b> and your exact Ki DC shows here.</div>

  );
}

// Class-specific resource counts shown beside the DC bar. Reference values at
// the selected level (1–7), matching the sheet's non-interactive style.
function ClassResources({cls, lv}){
  const {profile} = useProfile();
  const mods = (profile && profile.mods) || {};
  const arr = SLOTS[lv];
  let boxes = [];
  if(cls==="lore"){
    const die = lv>=5 ? "d8" : "d6";
    const chaMod = typeof mods.cha==="number" ? mods.cha : 0;
    const hasCha = chaMod!==0 || (profile && profile.name);
    const uses = Math.max(1, chaMod);
    boxes.push(<ResItem key="bi" label="Bardic Inspiration"
      val={hasCha ? uses : "CHA"}
      sub={hasCha ? `${die} · ${lv>=5?"short/long rest":"long rest"}` : `mod (min 1) · ${die}`} />);
  } else if(cls==="life"){
    const uses = lv>=6 ? 2 : (lv>=2 ? 1 : 0);
    boxes.push(<ResItem key="cd" label="Channel Divinity"
      val={uses||"—"} sub={uses?`${uses} / rest · Turn Undead & Preserve Life share`:"unlocks L2"} />);
    if(lv>=2) boxes.push(<ResItem key="pl" label="Preserve Life" val={5*lv} sub="HP pool per use" />);
  } else if(cls==="moon"){
    const uses = lv>=2 ? 2 : 0;
    boxes.push(<ResItem key="ws" label="Wild Shape"
      val={uses||"—"} sub={uses?`${uses} / rest · CR ≤ ${lv>=6?2:1} · ${Math.floor(lv/2)} hr`:"unlocks L2"} />);
  } else if(cls==="wizard"){
    const rec = Math.ceil(lv/2);
    boxes.push(<ResItem key="ar" label="Arcane Recovery" val={rec} sub="slot-levels · 1/day, short rest" />);
  } else if(cls==="shadow" || cls==="elements"){
    const ki = lv>=2 ? lv : 0;
    boxes.push(<ResItem key="ki" label="Ki Points" val={ki||"—"} sub={ki?"= monk level · short/long rest":"unlocks L2"} />);
  }
  if(arr && arr.length) boxes.push(<ResItem key="slots" label="Spell Slots" val={<span className="slotnums">{arr.map((c,i)=><span key={i} className="slotnum"><b>{c}</b><span className="sll">{["1st","2nd","3rd","4th","5th"][i]||`${i+1}th`}</span></span>)}</span>} />);
  return <div className="resbar">{boxes}</div>;
}

// Decide which ability modifier applies to a weapon's damage, given its
// properties string and a fallback melee stat. Finesse/ranged weapons may use
// DEX; the player picks the better of STR/DEX for finesse, so we surface the
// higher of the two. Pure ranged (Ammunition, no Finesse) uses DEX; pure melee
// uses STR. forceStat overrides everything (e.g. monk unarmed, shillelagh).
function weaponDmgMod(props, mods, forceStat, choice){
  const str = mods.str || 0, dex = mods.dex || 0;
  const better = () => dex >= str ? {key:"DEX", val:dex} : {key:"STR", val:str};
  if(forceStat) return {key:forceStat.toUpperCase(), val:mods[forceStat]||0};
  if(choice) return better(); // monk: STR or DEX on any monk weapon
  const p = (props||"").toLowerCase();
  const finesse = p.includes("finesse");
  const ranged  = p.includes("ammunition");
  if(finesse) return better(); // player's choice — show the stronger option
  if(ranged) return {key:"DEX", val:dex};
  return {key:"STR", val:str};
}
// Weapon table renderer: rows = [name, dmgDie, dmgType, properties, range/notes]
// forceStat (optional): force every row to use this ability mod for damage.
function WeaponTable({rows, atkFormula, dmgFormula, note, forceStat, choice}){
  const {profile} = useProfile();
  const mods = (profile && profile.mods) || {};
  const set = profile && (profile.name || Object.values(mods).some(v=>v!==0));
  return (<>
    <table className="rtable"><thead><tr><th style={{width:'18%'}}>Weapon</th><th style={{width:'14%'}}>Damage</th><th style={{width:'16%'}}>Properties</th><th>Notes / Range</th></tr></thead>
    <tbody>{rows.map((r,i)=>{
      const m = weaponDmgMod(r[2], mods, forceStat, choice);
      return (<tr key={i}>
        <td className="nm" data-label="Weapon">{r[0]}</td>
        <td data-label="Damage">{r[1]} <span className="wdmod">{fmt(m.val)} <span className="rmlbl">({m.key}{set?"":" mod"})</span></span></td>
        <td data-label="Properties">{r[2]}</td>
        <td data-label="Notes">{r[3]}</td>
      </tr>);
    })}</tbody></table>
    <div className="note"><b>Attack roll</b> = <Roll>{atkFormula}</Roll> &nbsp;|&nbsp; <b>Damage roll</b> = <Roll>{dmgFormula}</Roll>. The modifier shown beside each weapon uses your saved ability scores{forceStat?"":(choice?"; every monk weapon shows whichever of STR/DEX is higher (your choice)":"; finesse weapons show whichever of STR/DEX is higher (your choice)")}. {note}</div>
  </>);
}

  ["1–4","1d4","Your starting die — also the minimum damage of any unarmed strike or monk weapon."],

];
const KI_ABILITIES = [
  ["Flurry of Blows","1 ki","Bonus Action","2 extra unarmed strikes right after your Attack action — your main damage lever every ki-positive turn."],
  ["Patient Defense","1 ki","Bonus Action","Dodge as a bonus action — attackers have disadvantage vs you until your next turn."],
  ["Step of the Wind","1 ki","Bonus Action","Disengage or Dash as a bonus action, plus double jump distance — best for repositioning or chasing."],

function MartialArtsKiGuide({lv}){
  const showLv = lv || 7;
  const maDie = showLv>=17?'1d10': showLv>=11?'1d8': showLv>=5?'1d6':'1d4';
  const kiPool = showLv>=2?showLv:0;
  return (<>
    <Sec title="What Martial Arts Actually Does">
      <div className="actcard">
        <p><b>The short version:</b> Martial Arts lets you fight with your fists or a small set of light weapons as well as a fighter swings a sword — it upgrades your unarmed damage, lets you use DEX instead of STR, and gives you a free extra attack every single turn, no ki required.</p>
        <ul>
          <li><b>Use DEX instead of STR</b> for the attack roll and damage roll of unarmed strikes and monk weapons — pick whichever is better and stick with it.</li>
          <li><b>Bigger unarmed damage die</b> — replaces the flat "1 bludgeoning" of a normal unarmed strike with your Martial Arts die. This die is <i>added to</i> your ability modifier just like any weapon (damage = die + STR/DEX mod, not one or the other) — and it also replaces a monk weapon's own die whenever your Martial Arts die is bigger.</li>
          <li><b>Active from level 1</b> — every monk gets this immediately, not something that unlocks later. (Your subclass's level-3 feature — Shadow Arts or Disciple of the Elements — adds new ki options; it doesn't change how the base Martial Arts math works.)</li>
          <li><b>Free bonus-action strike</b> — every time you take the Attack action using an unarmed strike or a monk weapon, you get one extra unarmed strike as a bonus action, at no ki cost. This is always on; Flurry of Blows (below) replaces it with two strikes instead of one when you want to spend ki.</li>
        </ul>
      </div>
      <table className="rtable"><thead><tr><th style={{width:'15%'}}>Monk Level</th><th style={{width:'15%'}}>Die</th><th>What Changes</th></tr></thead>
      <tbody>{MA_DIE_TABLE.map((r,i)=>{
        const isCurrent = lv && r[1]===maDie;
        return (<tr key={i} style={isCurrent?{outline:'2px solid var(--blood)'}:undefined}><td className="nm" data-label="Monk Level">{r[0]}{isCurrent?' ← you are here':''}</td><td data-label="Die"><Roll>{r[1]}</Roll></td><td data-label="What Changes">{r[2]}</td></tr>);
      })}</tbody></table>
    </Sec>
    <Sec title="What Ki Actually Does">
      <div className="actcard">
        <p><b>The short version:</b> Ki points are a once-per-rest resource pool that fuels your strongest moves — think of them as "special move" charges. You get a number of points equal to your monk level (starting at 2nd level), and every point spent comes back on a short <i>or</i> long rest, so don't be shy about using them.</p>
        <ul>
          <li><b>Current pool at level {showLv}:</b> {kiPool||'0 — Ki unlocks at level 2'} points.</li>
          <li><b>Ki Save DC</b> (used whenever an ability forces an enemy to resist it): <Roll>8 + prof + WIS mod</Roll> = <FlatCalc base={8 + (showLv>=5?3:2)} statKeys={["wis"]}/> at {lv?"your current level":"level 7"}.</li>
          <li><b>Refresh:</b> all spent ki returns after a short <i>or</i> long rest — unlike spell slots, you can safely spend it every fight.</li>
        </ul>
      </div>
      <table className="rtable"><thead><tr><th style={{width:'20%'}}>Ability</th><th style={{width:'10%'}}>Cost</th><th style={{width:'22%'}}>When You Use It</th><th>What It Does</th></tr></thead>
      <tbody>{KI_ABILITIES.map((r,i)=>(<tr key={i}><td className="nm" data-label="Ability">{r[0]}</td><td data-label="Cost"><span className="ki">{r[1]}</span></td><td data-label="When">{r[2]}</td><td data-label="Effect">{r[3]}</td></tr>))}</tbody></table>
    </Sec>
  </>);
}

    acts.push(<Act key="fob" name="Flurry of Blows" meta="Bonus Action · 1 ki point">

    </Act>);
    acts.push(<Act key="pd" name="Patient Defense" meta="Bonus Action · 1 ki point">
      <p>Take the Dodge action as a bonus action on your turn: until the start of your next turn, any attack roll made against you has disadvantage if you can see the attacker, and you make DEX saves with advantage.</p>

    acts.push(<Act key="sow" name="Step of the Wind" meta="Bonus Action · 1 ki point">

    </Act>);

      <p>If you catch it, you may spend 1 ki point as part of the same reaction to make a ranged attack with the weapon you just caught, using it as if it were a monk weapon: attack roll <Roll>d20 + DEX + prof</Roll>, damage <Roll>{maDie} + DEX</Roll>, range 20/60 ft, targeting a creature within range that you can see.</p>
    </Act>);
  }
  if(lv>=4){
    acts.push(<Act key="sf" name="Slow Fall" meta="Reaction · Trigger: you are falling">

    </Act>);
  }
  if(lv>=5){
    acts.push(<Act key="ea" name="Extra Attack" meta="Passive — modifies the Attack action">

    acts.push(<Act key="ss" name="Stunning Strike" meta="1 ki point · Trigger: you hit a creature with a melee weapon or unarmed strike">

      <p>No hard cap on uses per turn beyond your available ki — very strong on the first hit of an Extra Attack + Flurry sequence to lock a dangerous target down before its turn.</p>
    </Act>);
  }
  if(lv>=6){

  if(lv>=7){

    </Act>);
    acts.push(<Act key="som" name="Stillness of Mind" meta="Action · Self">

    </Act>);

      acts.push(<Act key="sa" name="Shadow Arts" meta="Action · 2 ki points per casting · Minor Illusion is free & unlimited">
        <p>Spend <b>2 ki points</b> to cast one of the following spells without needing material components. Each casting is a separate 2-ki expenditure:</p>
        <ul>
          <li><b>Darkness</b> — 15-ft radius of magical darkness for 10 min. Note: ordinary darkvision <i>cannot</i> see through it, including your own — so this blinds you too unless you have Devil's Sight or similar.</li>
          <li><b>Darkvision</b> — grant a creature you touch 60-ft darkvision for 8 hours. Long duration makes this the most ki-efficient option: cast it, short rest to refund the ki, and the party keeps 7+ hours of darkvision.</li>
          <li><b>Pass without Trace</b> — <Roll>+10 to Stealth</Roll> for you and allies within 30 ft, and you can't be tracked non-magically. Concentration, 1 hour. Usually the strongest pick.</li>
          <li><b>Silence</b> — 20-ft radius where no sound exists; blocks any spell with a Verbal component. Ritual-castable in the base spell, but not when cast this way.</li>
        </ul>
        <p>You also learn the <b>Minor Illusion</b> cantrip if you don't already know it — that one costs no ki and can be used at will.</p>
        <p className="note" style={{margin:'6px 0 0'}}>Budget warning: at level 3 you only have 3 ki, so a single Shadow Arts casting eats most of your pool and competes directly with Flurry of Blows and Stunning Strike. This feature gets much more usable around levels 6–8.</p>
      </Act>);
    }
    if(lv>=6){
      acts.push(<Act key="sst" name="Shadow Step" meta="Bonus Action · NO ki cost · Requires: you are in dim light or darkness">
        <p>When you are in dim light or darkness, teleport up to <Roll>60 feet</Roll> to an unoccupied space you can see that is <b>also</b> in dim light or darkness.</p>
        <p>You then have <b>advantage on the first melee attack you make before the end of the turn</b>.</p>
        <p>This is your signature move and it is <i>free</i> — it doesn't compete with your ki, so a typical turn is: Shadow Step (bonus action) into position with advantage → Attack action → spend ki on Stunning Strike. Because it uses your bonus action, it does compete with Flurry of Blows.</p>
        <p className="note" style={{margin:'6px 0 0'}}>Two gotchas: you must be able to <i>see</i> the destination, so you can't jump into your own magical Darkness; and in bright daylight with no shadows, the feature simply doesn't work.</p>
      </Act>);
    }
  }
  if(sub==='elements'){
    if(lv>=3){
      acts.push(<Act key="doe" name="Disciple of the Elements" meta="Passive — you know Elemental Attunement + 1 more discipline at L3, +1 more at L6">
        <p>You learn magical <b>elemental disciplines</b> that each cost ki to use. You know <b>Elemental Attunement</b> plus <b>one</b> discipline of your choice at 3rd level, and learn <b>one additional</b> discipline at 6th level (then again at 11th and 17th, outside this sheet's range).</p>
        <p>Whenever you learn a new discipline, you may also swap one discipline you already know for a different one.</p>
        <p><b>Casting elemental spells:</b> disciplines that cast a spell use that spell's normal casting time and rules, but you never need material components. Saving throws against your disciplines use your <b>Ki save DC</b>.</p>
        <p><b>Upcasting (5th level+):</b> you may spend extra ki to raise a discipline-spell's level by 1 per extra ki, if that spell scales. The total ki spent on one spell is capped by your monk level: <Roll>max 3 ki at levels 5–8</Roll> (4 at 9–12, 5 at 13–16, 6 at 17+).</p>
        <p className="note" style={{margin:'6px 0 0'}}>Action-economy warning: nearly every discipline uses your <b>Action</b>, which means you did <i>not</i> take the Attack action — so you get no Martial Arts bonus strike and no Flurry of Blows that turn. Fangs of the Fire Snake is the notable exception, since it rides on the Attack action.</p>
      </Act>);
      acts.push(<Act key="ea" name="Elemental Attunement" meta="Action · FREE (no ki) · 30 ft · Always known">
        <p>Briefly control elemental forces within 30 feet, producing one of:</p>
        <ul>
          <li>A harmless instantaneous sensory effect (sparks, a puff of wind, mist, rumbling stone).</li>
          <li>Instantly light or snuff out a candle, torch, or small campfire.</li>
          <li>Chill or warm up to 1 lb of nonliving material for up to 1 hour.</li>
          <li>Shape earth, fire, water, or mist that fits in a 1-foot cube into a crude form for 1 minute.</li>
        </ul>
        <p>Purely utility/flavor — no damage. Think of it as the monk's cantrip-tier party trick.</p>
      </Act>);
    }
  }
  if(!q || !q.trim()) return acts;
  // Filter Act cards by their name + meta + body text (same alias-aware matching).
  const terms = q.trim().toLowerCase().split(/\s+/);
  return acts.filter(a=>{
    const p = a.props || {};
    const hay = (nodeText(p.name)+" "+nodeText(p.meta)+" "+nodeText(p.children)).toLowerCase();
    return terms.every(term=>{
      if(hay.includes(term)) return true;
      const alts = SEARCH_ALIASES[term];
      return alts ? alts.some(x=>hay.includes(x)) : false;
    });
  });
}

function DisciplineTable({lv}){
  const gate = d => parseInt(d[2]);
  const avail = DISCIPLINES.filter(d=>gate(d)<=lv);
  const later = DISCIPLINES.filter(d=>gate(d)>lv);
  const rows = arr => (
    <table className="rtable"><thead><tr><th style={{width:'20%'}}>Discipline</th><th style={{width:'12%'}}>Ki Cost</th><th style={{width:'8%'}}>Level</th><th>Effect &amp; Rolls</th></tr></thead>
    <tbody>{arr.map((d,i)=>(<tr key={i}><td className="nm" data-label="Discipline">{d[0]}</td><td data-label="Ki Cost"><span className="ki">{d[1]}</span></td><td data-label="Level">{d[2]}</td><td data-label="Effect">{d[3]}</td></tr>))}</tbody></table>
  );
  return (<>
    <Sec title={`Elemental Disciplines — available to you at level ${lv}`}>
      <div className="note" style={{marginBottom:'8px'}}>You know <b>Elemental Attunement</b> plus <b>{lv>=6?'two':'one'}</b> other discipline{lv>=6?'s':''} of your choice from this list (1 chosen at L3{lv>=6?', 1 more at L6':''}). Saves use your <b>Ki save DC</b>. Upcasting caps at <b>3 total ki per spell</b> at levels 5–8.</div>
      {rows(avail)}
    </Sec>
    {later.length>0 && (
      <Sec title="Disciplines unlocked at higher levels (for planning)">
        {rows(later)}
      </Sec>
    )}
  </>);
}

    <Sec title="Conditions — fast reference">
      <table className="rtable"><thead><tr><th style={{width:'20%'}}>Condition</th><th>Effect</th></tr></thead>

          <li><b>Advantage/disadvantage don't stack</b> — you either have it or you don't, and if you have both, they cancel to a straight roll.</li>
          <li><b>Critical hits</b> double the <i>dice</i> only, not flat modifiers (roll 2× weapon/spell dice, then add mods once).</li>
          <li><b>Concentration:</b> one concentration spell at a time; taking damage forces a <Roll>CON save, DC 10 or half the damage, whichever is higher</Roll>.</li>
          <li><b>Standing from prone</b> costs half your movement — it doesn't cost an action.</li>

        </ul>
      </div>
    </Sec>
  </>);

function FavoritesPanel(){

  // Collect every starred spell across all class lists, grouped by class+level
  const groups = SPELL_GROUPS
    .map(g=>({...g, filtered: filterRows(g.rows().filter(r=>stars.has(spellId(r))), q)}))
    .filter(g=>g.filtered.length>0);
  const totalStarred = SPELL_GROUPS.reduce((n,g)=>n+g.rows().filter(r=>stars.has(spellId(r))).length,0);
  const shown = groups.reduce((n,g)=>n+g.filtered.length,0);
  // A spell on multiple class lists counts once for the "unique" tally
  const uniqueNames = new Set();
  SPELL_GROUPS.forEach(g=>g.rows().forEach(r=>{ if(stars.has(spellId(r))) uniqueNames.add(nodeText(r[0]).trim()); }));

const DM_PASSWORD = "1234";
const DM_UNLOCK_KEY = "dnd_codex_dm_unlocked_v1";
function DMGate({children, title}){
  const [unlocked, setUnlocked] = useState(()=>{
    try{ return window.sessionStorage.getItem(DM_UNLOCK_KEY)==="1"; }catch(e){ return false; }
  });
  const [entry, setEntry] = useState("");
  const [err, setErr] = useState(false);
  const submit = ()=>{
    if(entry === DM_PASSWORD){
      setUnlocked(true); setErr(false); setEntry("");
      try{ window.sessionStorage.setItem(DM_UNLOCK_KEY,"1"); }catch(e){}
    } else { setErr(true); setEntry(""); }
  };
  const lock = ()=>{
    setUnlocked(false);
    try{ window.sessionStorage.removeItem(DM_UNLOCK_KEY); }catch(e){}
  };
  if(!unlocked){
    return (
      <div className="dmgate">
        <div className="dmlock">🔒</div>
        <div className="dmtitle">DM Only</div>
        <div className="dmsub">{title} is locked. Enter the DM password to continue.</div>
        <div className="dmrow">
          <input
            className={"dminput"+(err?" err":"")}
            type="password"
            inputMode="numeric"
            value={entry}
            placeholder="Password"
            onChange={e=>{ setEntry(e.target.value); setErr(false); }}
            onKeyDown={e=>{ if(e.key==="Enter") submit(); }}
            autoComplete="off"
          />
          <button className="dmbtn" onClick={submit}>Unlock</button>
        </div>
        {err && <div className="dmerr">Incorrect password — try again.</div>}
      </div>
    );
  }
  return (<>
    <div className="dmunlocked">
      <span>🔓 <b>DM view unlocked</b></span>
      <button onClick={lock}>Lock again</button>
    </div>
    {children}
  </>);
}

function MasterWeapons(){
  const [q, setQ] = useState("");
  const usedBy = buildWeaponUsers();
  // dedupe all weapon rows into one master list, keep richest properties/notes we have
  const all = {};
  [simpleMelee, simpleRanged, bardMartial, clericWeapons, druidWeapons, monkWeapons, wizardWeapons].forEach(list=>{
    list.forEach(r=>{ if(!all[r[0]]) all[r[0]] = r; });
  });
  const allNames = Object.keys(all).sort();
  // search across name, damage, properties, notes AND the "used by" class tags
  const names = (()=>{
    const s = q.trim().toLowerCase();
    if(!s) return allNames;
    const terms = s.split(/\s+/);
    return allNames.filter(n=>{
      const tags = Array.from(usedBy[n]||[]).join(" ");
      const hay = (n + " " + all[n].slice(1).join(" ") + " " + tags).toLowerCase();
      return terms.every(t=>hay.includes(t));
    });
  })();
  const searching = q.trim().length>0;
  return (<>
    <SearchBox
      value={q} onChange={setQ}
      placeholder="Search weapons — name, damage, property, class…"
      count={names.length} total={allNames.length}
    />
    {!searching && <WeaponAttackExplainer/>}
    {!searching && <QuickMath/>}
    <Sec title="Every Weapon in Play — Master List">
      {names.length===0 ? (
        <div className="emptymsg">No weapons match “{q}”. Try <b>finesse</b>, <b>thrown</b>, <b>monk</b>, <b>1d8</b>, or a weapon name.</div>
      ) : (
      <table className="rtable"><thead><tr><th style={{width:'16%'}}>Weapon</th><th style={{width:'12%'}}>Damage</th><th style={{width:'18%'}}>Properties</th><th style={{width:'18%'}}>Used By</th><th>Notes</th></tr></thead>
      <tbody>{names.map((n,i)=>{
        const r = all[n];
        const tags = Array.from(usedBy[n]||[]);
        return (<tr key={i}><td className="nm" data-label="Weapon">{n}</td><td data-label="Damage">{r[1]}</td><td data-label="Properties">{r[2]}</td>
          <td data-label="Used By">{tags.map((t,j)=><span key={j} className="pill" style={{marginRight:'2px'}}>{t}</span>)}</td>
          <td data-label="Notes">{r[3]}</td></tr>);
      })}</tbody></table>
      )}
    </Sec>
    <Sec title="Attack &amp; Damage Formulas — by class">
      <table className="rtable"><thead><tr><th style={{width:'18%'}}>Class</th><th style={{width:'40%'}}>Attack Roll</th><th>Damage Roll</th></tr></thead><tbody>
        <tr><td className="nm" data-label="Class">Lore Bard</td><td data-label="Attack Roll"><Roll>d20 + STR or DEX (finesse/ranged) + prof</Roll></td><td data-label="Damage Roll"><Roll>weapon die + same mod</Roll></td></tr>
        <tr><td className="nm" data-label="Class">Shadow Monk</td><td data-label="Attack Roll"><Roll>d20 + STR or DEX (your choice) + prof</Roll></td><td data-label="Damage Roll"><Roll>Martial Arts die OR weapon die (higher) + same mod</Roll></td></tr>
        <tr><td className="nm" data-label="Class">4 Elements Monk</td><td data-label="Attack Roll"><Roll>d20 + STR or DEX (your choice) + prof</Roll></td><td data-label="Damage Roll"><Roll>Martial Arts die OR weapon die (higher) + same mod</Roll>; Fangs of the Fire Snake converts to fire dmg +1d10</td></tr>
        <tr><td className="nm" data-label="Class">Life Cleric</td><td data-label="Attack Roll"><Roll>d20 + STR + prof</Roll> (DEX only if wielding the finesse Dagger)</td><td data-label="Damage Roll"><Roll>weapon die + same mod</Roll></td></tr>
        <tr><td className="nm" data-label="Class">Moon Druid</td><td data-label="Attack Roll"><Roll>d20 + STR or DEX (finesse) + prof</Roll>; <Roll>d20 + WIS + prof</Roll> if using Shillelagh on club/quarterstaff</td><td data-label="Damage Roll"><Roll>weapon die + same mod</Roll>; Shillelagh forces <Roll>1d8 + WIS</Roll></td></tr>
        <tr><td className="nm" data-label="Class">Evocation Wizard</td><td data-label="Attack Roll"><Roll>d20 + STR (Quarterstaff/Crossbow) or DEX (Dagger/Dart/Sling) + prof</Roll></td><td data-label="Damage Roll"><Roll>weapon die + same mod</Roll> — rarely relevant since wizards fight with spells, not weapons</td></tr>
      </tbody></table>
      <div className="note">"Monk (both)" = usable by Shadow and 4 Elements alike. Neither subclass grants extra weapon proficiencies beyond the standard monk list, so their weapon options are identical.</div>
    </Sec>
  </>);
}

function App(){
  const [cls, setCls] = useState("lore");
  const [lv, setLv] = useState(1);
  const [view, setView] = useState("features");
  const [masterMode, setMasterMode] = useState(false);
  const [shopMode, setShopMode] = useState(false);
  const [favMode, setFavMode] = useState(false);
  const [profileMode, setProfileMode] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const [masterView, setMasterView] = useState("spells");
  const [clsOnlyStarred, setClsOnlyStarred] = useState(false);
  const [clsQ, setClsQ] = useState("");
  const {stars} = useStars();
  // unique starred spell names (a spell on 3 class lists counts once on the badge)
  const starCount = (()=>{ const s=new Set();
    SPELL_GROUPS.forEach(g=>g.rows().forEach(r=>{ if(stars.has(spellId(r))) s.add(nodeText(r[0]).trim()); }));
    return s.size; })();
  const K = CLASSES[cls];

  // Mobile swipe strip: keep the active class tab centered, and track scroll
  // position so we can show directional arrow cues only when there's more to reach.
  const subtabsRef = useRef(null);
  const [scrollEdges, setScrollEdges] = useState({left:false, right:false});
  const activeKey = profileMode ? "profile" : masterMode ? "master" : shopMode ? "shop" : favMode ? "fav" : cls;
  const updateEdges = ()=>{
    const strip = subtabsRef.current;
    if(!strip) return;
    const scrollable = strip.scrollWidth - strip.clientWidth;
    if(scrollable <= 2){ setScrollEdges({left:false, right:false}); return; }
    setScrollEdges({
      left: strip.scrollLeft > 4,
      right: strip.scrollLeft < scrollable - 4,
    });
  };
  useEffect(()=>{
    const strip = subtabsRef.current;
    if(!strip) return;
    const active = strip.querySelector(".subtab.on");
    // No-op on desktop (strip wraps, so it isn't horizontally scrollable).
    if(active && strip.scrollWidth > strip.clientWidth){
      const target = active.offsetLeft - (strip.clientWidth/2) + (active.offsetWidth/2);
      const max = strip.scrollWidth - strip.clientWidth;
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      strip.scrollTo({left: Math.max(0, Math.min(target, max)), behavior: reduce?"auto":"smooth"});
    }
    // Recompute arrow visibility after the scroll settles.
    updateEdges();
    const t = setTimeout(updateEdges, 350);
    return ()=>clearTimeout(t);
  }, [activeKey]);
  useEffect(()=>{
    updateEdges();
    window.addEventListener("resize", updateEdges);
    return ()=>window.removeEventListener("resize", updateEdges);
  }, []);
  useEffect(()=>{ setClsQ(""); }, [cls, view, masterMode, shopMode, favMode, profileMode]);

  // Mobile: once the player scrolls down into a list, collapse the bulky level
  // row + view toggles so the sticky bar keeps only the class tabs pinned —
  // reclaiming ~1/3 of the screen mid-combat. Scrolling back near the top or
  // switching tabs restores the full nav. Hysteresis (80 down / 30 up) avoids
  // flicker. Desktop nav isn't sticky, so this is a harmless no-op there.
  const [navCondensed, setNavCondensed] = useState(false);
  useEffect(()=>{
    let ticking = false;
    const onScroll = ()=>{
      if(ticking) return;
      ticking = true;
      window.requestAnimationFrame(()=>{
        const y = window.scrollY || window.pageYOffset || 0;
        setNavCondensed(prev => prev ? y > 30 : y > 80);
        ticking = false;
      });
    };
    window.addEventListener("scroll", onScroll, {passive:true});
    return ()=>window.removeEventListener("scroll", onScroll);
  }, []);
  // Any tab / level / view change resets to full nav (view returns to the top).
  useEffect(()=>{ setNavCondensed(false); }, [activeKey, lv, view, masterView]);

  let headerRight="", body=null;
  const isMonk = K.kind==='monk';
  headerRight = isMonk ? `Key stat DEX/WIS · Hit die d8 · Saves ${K.saves}` : `Casting ${K.cast} · Hit die d8 · Saves ${K.saves}`;

  if(isMonk){
    if(view==='features'){
      const {maDie} = (()=>({maDie: lv>=17?'1d10': lv>=11?'1d8': lv>=5?'1d6':'1d4'}))();
      const filteredActs = monkActions(lv, K.sub, clsQ);
      const searching = clsQ.trim().length>0;
      const totalActs = monkActions(lv, K.sub).length;
      body = <>
        <SearchBox
          value={clsQ} onChange={setClsQ}
          placeholder="Search monk actions — ki, stun, dodge, discipline…"
          count={filteredActs.length} total={totalActs}
        />
        {!searching && <Sec title="At-a-Glance">
          <div className="slots">
            <span className="slot">Martial Arts die: {maDie}</span>
            <span className="slot">Ki points: {lv>=2?lv:'—'}</span>
            <span className="slot">Unarmored move bonus: {lv>=6?'+15 ft':lv>=2?'+10 ft':'—'}</span>
            <span className="slot">Attacks/action: {lv>=5?2:1}</span>
          </div>
          <div className="note">AC (no armor/shield) = <FlatCalc base={10} statKeys={["dex","wis"]}/>. Ki save DC = <FlatCalc base={8+ (lv>=5?3:2)} statKeys={["wis"]}/>.</div>
        </Sec>}
        {!searching && <MartialArtsKiGuide lv={lv}/>}
        {!searching && K.sub==='elements' && lv>=3 && <DisciplineTable lv={lv}/>}
        <Sec title={searching ? "Matching Combat Actions" : "All Non-Basic Combat Actions (full detail, cumulative to this level)"}>
          {searching && filteredActs.length===0
            ? <div className="emptymsg">No monk actions match “{clsQ}”. Try <b>ki</b>, <b>stun</b>, <b>flurry</b>, <b>dodge</b>, or a discipline name.</div>
            : filteredActs}
        </Sec>
      </>;

      body = MonkWeaponsPanel(K.sub);

  } else {
    const feats = cls==='lore'?LoreFeatures(lv): cls==='life'?LifeFeatures(lv): cls==='moon'?MoonFeatures(lv): WizardFeatures(lv);
    const slotArr = SLOTS[lv];
    const prof = PROF[lv];

      body = <>
        <Sec title="Class & Subclass Features (full detail, cumulative to this level)">{feats}</Sec>

        {cls==='moon' && lv>=2 && (
          <Sec title="Wild Shape — Available Combat Forms">
            {(() => { const set = lv>=6?moonForms[6]:moonForms[2];
              return <table className="rtable"><thead><tr><th style={{width:'20%'}}>Beast</th><th style={{width:'30%'}}>Stat Block</th><th>Attacks (full rolls)</th></tr></thead>
              <tbody>{set.map((r,i)=><tr key={i}><td className="nm" data-label="Beast">{r[0]}</td><td data-label="Stat Block">{r[1]}</td><td data-label="Attacks">{r[2]}</td></tr>)}</tbody></table>; })()}
            <div className="note">You use the beast's STR/DEX/CON, HP, speed, and listed attacks (already includes its own to-hit and damage bonus) — not your own physical stats. Your INT/WIS/CHA, alignment, and personality stay yours.</div>
          </Sec>
        )}
        {casterNote(K.statLabel, prof)}
      </>;
    } else if(view==='spells'){
      const S = rows => keepStarred(rows, stars, clsOnlyStarred);

      const anyStarred = [book.cant,book.l1,book.l2,book.l3,book.l4].some(r=>S(r).length>0);
      const groups = [
        {t:"Cantrips", rows:F(book.cant), show:true},

        {t:"4th-Level Spells — full candidate list", rows:F(book.l4), show:lv>=7},
      ].filter(g=>g.show);
      const totalShown = groups.reduce((n,g)=>n+g.rows.length, 0);
      const totalAvail = [book.cant,book.l1, lv>=3&&book.l2, lv>=5&&book.l3, lv>=7&&book.l4]

      const searching = clsQ.trim().length>0;
      body = <>
        <SearchBox
          value={clsQ} onChange={setClsQ}
          placeholder={"Search "+K.label+" spells — name, effect, damage…"}
          count={totalShown} total={totalAvail}
        />
        <StarBar onlyStarred={clsOnlyStarred} setOnlyStarred={setClsOnlyStarred} scopeLabel={clsOnlyStarred?"starred spells only":"all spells for this class"}/>
        {clsOnlyStarred && !anyStarred && <div className="emptymsg">No starred spells for this class yet — tap the ☆ beside any spell to pin it.</div>}
        {searching && totalShown===0 && <div className="emptymsg">No spells match “{clsQ}”. Try a spell name, a condition like <b>prone</b>, or an effect like <b>heal</b> or <b>damage</b>.</div>}
        {groups.map((g,i)=> g.rows.length>0 && <Sec key={i} title={g.t}>{<SpellTable rows={g.rows}/>}</Sec>)}
        {!searching && casterNote(K.statLabel, prof)}
        {!searching && legend}
      </>;
    } else {
      body = cls==='lore' ? LoreWeapons() : cls==='life' ? LifeWeapons() : cls==='moon' ? MoonWeapons() : WizardWeapons();
    }
  }

  const tabs = isMonk ? ["features","weapons"] : ["features","spells","weapons"];
  const tabLabel = {features:"Features & Actions", spells:"Full Spell Lists", weapons:"Weapons & Rolls"};

  return (
    <div>
      <button className="helpfab" onClick={()=>setHelpOpen(true)} aria-label="How to use this site" title="How to use this site">?</button>
      {helpOpen && <HelpModal onClose={()=>setHelpOpen(false)}/>}
      <div className="head">
        <div className="titlerow">
          <img className="titleimg" src={AVATAR_CHAR} alt="" />
          <h1>Party Combat Codex</h1>
          <img className="titleimg" src={AVATAR_PHOTO} alt="" />
        </div>
        <p>Levels 1–7 · Full mechanical detail on every action &amp; spell, plus weapon attack/damage rolls · Verified vs 2014 5e (PHB / XGtE / SRD 5.1)</p>
      </div>

      <div className={"navwrap"+(navCondensed?" condensed":"")}>
        <div className="subtabs-wrap" data-l={scrollEdges.left?"1":"0"} data-r={scrollEdges.right?"1":"0"}>
        <div className="subtabs" ref={subtabsRef} onScroll={updateEdges}>
          {ORDER.map(k=>(
            <button key={k} className={"subtab"+(!masterMode && !shopMode && !favMode && !profileMode && k===cls?" on":"")} onClick={()=>{setCls(k); setView("features"); setMasterMode(false); setShopMode(false); setFavMode(false); setProfileMode(false);}}>{CLASSES[k].label}</button>
          ))}
          <button className={"subtab"+(masterMode?" on":"")} style={{background: masterMode?'var(--blood)':'var(--parch)', color: masterMode?'#fff':'var(--ink)', borderColor:'var(--blood)'}} onClick={()=>{setMasterMode(true); setShopMode(false); setFavMode(false); setProfileMode(false);}}>★ Master Reference</button>
          <button className={"subtab"+(shopMode?" on":"")} style={{background: shopMode?'var(--moss)':'var(--parch)', color: shopMode?'#fff':'var(--ink)', borderColor:'var(--moss)'}} onClick={()=>{setShopMode(true); setMasterMode(false); setFavMode(false); setProfileMode(false);}}>🔒 Shop &amp; Prices</button>
          <button className={"subtab favtab"+(favMode?" on":"")} onClick={()=>{setFavMode(true); setMasterMode(false); setShopMode(false); setProfileMode(false);}}>★ Favorites{starCount>0 && <span className="favcount">{starCount}</span>}</button>
          <button className={"subtab"+(profileMode?" on":"")} style={{background: profileMode?'var(--gold)':'var(--parch)', color: profileMode?'#fff':'var(--ink)', borderColor:'var(--gold)'}} onClick={()=>{setProfileMode(true); setMasterMode(false); setShopMode(false); setFavMode(false);}}>👤 My Character</button>
        </div>
        </div>

        {shopMode || favMode || profileMode ? null : masterMode ? (
          <div className="viewtoggle">
            <button className={"vt"+(masterView==='spells'?' on':'')} onClick={()=>setMasterView('spells')}>All Spells<span className="wide"> (every caster)</span></button>
            <button className={"vt"+(masterView==='weapons'?' on':'')} onClick={()=>setMasterView('weapons')}>All Weapons<span className="wide"> (every class)</span></button>
            <button className={"vt"+(masterView==='monk'?' on':'')} onClick={()=>setMasterView('monk')}>Martial Arts &amp; Ki<span className="wide"> (monks)</span></button>
            <button className={"vt"+(masterView==='combat'?' on':'')} onClick={()=>setMasterView('combat')}>Combat Actions<span className="wide"> (everyone)</span></button>
          </div>
        ) : (
          <>
            <div className="levels">
              <div className="lvlbl">Choose a level</div>
              {[1,2,3,4,5,6,7].map(n=>(
                <button key={n} className={"lvbtn"+(n===lv?" on":"")} onClick={()=>setLv(n)}>{n}</button>
              ))}
            </div>
            <div className="viewtoggle">
              {tabs.map(t=>(<button key={t} className={"vt"+(view===t?' on':'')} onClick={()=>setView(t)}>{tabLabel[t]}</button>))}
            </div>
          </>
        )}
      </div>

      {profileMode ? (
        <div className="panel" key="profile">
          <div className="lvhead">
            <h2>👤 My Character</h2>
            <span className="sub">Enter your modifiers once — your save DC, spell attack, saves &amp; more, always ready</span>
          </div>
          <ProfilePanel/>
        </div>
      ) : favMode ? (
        <div className="panel" key="fav">
          <div className="lvhead">
            <h2>★ Favorites</h2>
            <span className="sub">Every spell you've starred, in one place — your working combat sheet</span>
          </div>
          <FavoritesPanel/>
        </div>
      ) : shopMode ? (
        <div className="panel" key="shop">
          <div className="lvhead">
            <h2>🪙 Shop &amp; Prices</h2>
            <span className="sub">What low-level parties actually buy — PHB/SRD prices with what each item does</span>
          </div>
          <DMGate title="Shop & Prices"><ShopPanel/></DMGate>
        </div>
      ) : masterMode ? (
        <div className="panel" key={"master"+masterView}>
          <div className="lvhead">
            <h2>Master Reference</h2>
            <span className="sub">Everything through level 7, all 6 classes, one scannable list — for fast table lookup mid-combat</span>
          </div>
          {masterView==='spells' ? <MasterSpells/> : masterView==='weapons' ? <MasterWeapons/> : masterView==='combat' ? <UniversalCombat/> : <><MartialArtsKiGuide/><MonkSubclassSummary/></>}
        </div>
      ) : (
        <div className="panel" key={cls+lv+view}>
          <div className="lvhead">
            <h2>{K.label}</h2>
            <span className="sub">Level {lv} · {headerRight}</span>
          </div>
          {isMonk ? (
            <div className="dcrow">
              <KiDCBar lv={lv}/>
              <ClassResources cls={cls} lv={lv}/>
            </div>
          ) : (
            <div className="dcrow">
              <DCBar statLabel={K.statLabel} prof={PROF[lv]}/>
              <ClassResources cls={cls} lv={lv}/>
            </div>
          )}
          <ModBar statKeys={["str","dex","con","int","wis","cha"]} note="Fill these in and your spell/heal/AC/weapon numbers below update automatically. Synced with 👤 My Character." />
          {body}
        </div>
      )}

      <div className="foot">
        Prof bonus: +2 (L1–4), +3 (L5–7). Weapon/attack math assumes no magic items or feats beyond what's listed. Beast-form stat blocks are 2014 Monster Manual values.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<StarProvider><ProfileProvider><App/></ProfileProvider></StarProvider>);
</script>
